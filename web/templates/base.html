<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Biscuit finds who missed your BigBlueButton class by comparing the attendee list with your class list.">
    <link rel="icon" href="{{ url_for('static', filename='Cookie.ico') }}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
      :root { --biscuit: #b5651d; --biscuit-soft: #fdf3e7; }
      body { background: linear-gradient(180deg, var(--biscuit-soft) 0%, #fff 320px); min-height: 100vh; }
      .navbar-brand { font-weight: 700; letter-spacing: .3px; }
      .btn-biscuit { --bs-btn-bg: var(--biscuit); --bs-btn-border-color: var(--biscuit); --bs-btn-color: #fff;
        --bs-btn-hover-bg: #9a5418; --bs-btn-hover-border-color: #9a5418; --bs-btn-hover-color: #fff;
        --bs-btn-disabled-bg: var(--biscuit); --bs-btn-disabled-border-color: var(--biscuit); }
      .steps { display: flex; gap: .5rem; justify-content: center; margin: 1.5rem 0 1.25rem; }
      .step { display: flex; align-items: center; gap: .4rem; color: #8a8a8a; font-size: .9rem; }
      .step .dot { width: 1.6rem; height: 1.6rem; border-radius: 50%; display: inline-grid; place-items: center;
        background: #e9ecef; font-weight: 600; font-size: .8rem; }
      .step.active { color: #212529; font-weight: 600; }
      .step.active .dot { background: var(--biscuit); color: #fff; }
      .step.done .dot { background: #198754; color: #fff; }
      .step + .step::before { content: ""; width: 1.5rem; height: 2px; background: #dee2e6; margin-right: .3rem; }
      .card { border: 0; box-shadow: 0 6px 24px rgba(60, 40, 20, .08); border-radius: 1rem; }
      .dropzone { border: 2px dashed #d8c3ad; border-radius: .9rem; padding: 2rem 1rem; text-align: center;
        background: #fffaf4; cursor: pointer; transition: background .15s, border-color .15s; }
      .dropzone:hover, .dropzone.drag { background: #fdf0e1; border-color: var(--biscuit); }
      .stat { border-radius: .9rem; padding: 1rem; text-align: center; }
      .stat .num { font-size: 2rem; font-weight: 700; line-height: 1.1; }
      .howto img { max-height: 140px; object-fit: contain; border-radius: .5rem; border: 1px solid #eee; }
      footer a { color: inherit; }
    </style>
    <title>{% block title %}Biscuit{% endblock %} · Biscuit</title>
  </head>
  <body>
    <nav class="navbar bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('view.home') }}">
          <img src="{{ url_for('static', filename='Cookie.ico') }}" alt="" width="28" height="28"> Biscuit
        </a>
        <a class="nav-link text-secondary" href="{{ url_for('view.more') }}">About</a>
      </div>
    </nav>

    <main class="container" style="max-width: 860px">
      {% block steps %}{% endblock %}
      {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
      {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-secondary small py-4">
      Your files are processed in memory and never stored. ·
      Made by <a href="https://prasannan-robots.github.io" target="_blank" rel="noopener">Prasanna</a>
    </footer>

    <script>
      // File pickers: show the chosen file name and support drag & drop.
      document.querySelectorAll("[data-dropzone]").forEach((zone) => {
        const input = zone.querySelector("input[type=file]");
        const label = zone.querySelector("[data-filename]");
        zone.addEventListener("click", (e) => { if (e.target !== input) input.click(); });
        input.addEventListener("change", () => {
          label.textContent = input.files.length ? input.files[0].name : label.dataset.empty;
          if (input.form.dataset.autosubmit !== undefined && input.files.length) {
            input.form.querySelector("[type=submit]").click();
          }
        });
        ["dragover", "dragenter"].forEach((t) => zone.addEventListener(t, (e) => { e.preventDefault(); zone.classList.add("drag"); }));
        ["dragleave", "drop"].forEach((t) => zone.addEventListener(t, () => zone.classList.remove("drag")));
        zone.addEventListener("drop", (e) => {
          e.preventDefault();
          input.files = e.dataTransfer.files;
          input.dispatchEvent(new Event("change"));
        });
      });
      // Disable submit buttons after the first click to avoid double posts.
      document.querySelectorAll("form").forEach((form) => form.addEventListener("submit", () => {
        const button = form.querySelector("[type=submit]");
        if (button) { button.disabled = true; button.dataset.label = button.innerHTML; button.innerHTML = "Working…"; }
      }));
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
